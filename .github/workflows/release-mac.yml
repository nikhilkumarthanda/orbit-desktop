name: macOS Release
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
jobs:
  package:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: npm ci
      - run: python -m pip install pyinstaller
      - run: npm run native:mac
      - run: pyinstaller sidecar/orbit-retrieval.spec --distpath release-sidecar --workpath build/pyinstaller
      - run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Verify packaged app signatures
        run: |
          app_path="$(find dist -type d -name 'Orbit.app' -print -quit)"
          test -n "$app_path"
          codesign --verify --deep --strict --verbose=4 "$app_path"
          if codesign -dvv "$app_path" 2>&1 | grep -q 'TeamIdentifier='; then
            team_id="$(codesign -dvv "$app_path" 2>&1 | sed -n 's/^TeamIdentifier=//p')"
            test -n "$team_id"
            while IFS= read -r code_path; do
              nested_team="$(codesign -dvv "$code_path" 2>&1 | sed -n 's/^TeamIdentifier=//p')"
              test -z "$nested_team" || test "$nested_team" = "$team_id"
            done < <(find "$app_path/Contents/Frameworks" -depth \
              \( -type d \( -name '*.framework' -o -name '*.app' -o -name '*.xpc' \) \
              -o -type f \( -name '*.dylib' -o -perm -111 \) \) -print)
          fi
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: Orbit-macOS
          path: dist/*.dmg
          if-no-files-found: error
