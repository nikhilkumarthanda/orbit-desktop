name: macOS Release
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
jobs:
  package:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: npm ci
      - run: python -m pip install pyinstaller
      - run: npm run native:mac
      - run: pyinstaller sidecar/orbit-retrieval.spec --distpath release-sidecar --workpath build/pyinstaller
      - run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Verify packaged app signatures
        run: |
          app_path="$(find dist -type d -name 'Orbit.app' -print -quit)"
          test -n "$app_path"
          codesign --verify --deep --strict --verbose=4 "$app_path"
          team_id="$(codesign -dvv "$app_path" 2>&1 | sed -n 's/^TeamIdentifier=//p')"
          while IFS= read -r code_path; do
            nested_team="$(codesign -dvv "$code_path" 2>&1 | sed -n 's/^TeamIdentifier=//p')"
            test "$nested_team" = "$team_id" || {
              echo "Team ID mismatch: $code_path has '$nested_team'; Orbit.app has '$team_id'"
              exit 1
            }
          done < <(find "$app_path/Contents/Frameworks" -depth \
            \( -type d \( -name '*.framework' -o -name '*.app' -o -name '*.xpc' \) \
            -o -type f \( -name '*.dylib' -o -perm -111 \) \) -print)
      - name: Verify app from finished DMG
        run: |
          dmg_path="$(find dist -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          test -n "$dmg_path"
          mount_dir="$(mktemp -d)"
          cleanup() {
            hdiutil detach "$mount_dir" -quiet || true
            rmdir "$mount_dir" || true
          }
          trap cleanup EXIT
          hdiutil attach "$dmg_path" -nobrowse -readonly -mountpoint "$mount_dir"
          installed_app="$mount_dir/Orbit.app"
          test -d "$installed_app"
          codesign --verify --deep --strict --verbose=4 "$installed_app"
          team_id="$(codesign -dvv "$installed_app" 2>&1 | sed -n 's/^TeamIdentifier=//p')"
          electron_framework="$installed_app/Contents/Frameworks/Electron Framework.framework/Versions/A/Electron Framework"
          test -f "$electron_framework"
          framework_team="$(codesign -dvv "$electron_framework" 2>&1 | sed -n 's/^TeamIdentifier=//p')"
          echo "Ad-hoc signature identities: Orbit='$team_id', Electron Framework='$framework_team'"
          codesign -d --entitlements :- "$installed_app" 2>/dev/null \
            | plutil -extract com.apple.security.cs.disable-library-validation raw - \
            | grep -qx true
          dyld_info="$(otool -L "$installed_app/Contents/MacOS/Orbit")"
          echo "$dyld_info" | grep -F '@rpath/Electron Framework.framework/Electron Framework'
      - name: Launch app from finished DMG
        run: |
          dmg_path="$(find dist -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          test -n "$dmg_path"
          mount_dir="$(mktemp -d)"
          cleanup() {
            if test -n "${orbit_pid:-}" && kill -0 "$orbit_pid" 2>/dev/null; then
              kill "$orbit_pid" || true
              wait "$orbit_pid" || true
            fi
            hdiutil detach "$mount_dir" -quiet || true
            rmdir "$mount_dir" || true
          }
          trap cleanup EXIT
          hdiutil attach "$dmg_path" -nobrowse -readonly -mountpoint "$mount_dir"
          executable="$mount_dir/Orbit.app/Contents/MacOS/Orbit"
          test -x "$executable"
          "$executable" --orbit-ci-smoke-test >"$RUNNER_TEMP/orbit-launch.log" 2>&1 &
          orbit_pid=$!
          sleep 10
          if ! kill -0 "$orbit_pid" 2>/dev/null; then
            cat "$RUNNER_TEMP/orbit-launch.log"
            wait "$orbit_pid"
            exit 1
          fi
          echo "Orbit remained alive after launch from the finished DMG."
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: Orbit-macOS
          path: dist/*.dmg
          if-no-files-found: error
