name: Package Current Orbit

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/package-request/**"

jobs:
  package:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: npm ci
      - run: python -m pip install pyinstaller
      - run: npm run native:mac
      - run: pyinstaller sidecar/orbit-retrieval.spec --distpath release-sidecar --workpath build/pyinstaller
      - name: Build unsigned macOS package
        run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Verify unsigned package contents
        run: npm run verify:mac -- --unsigned
      - name: Generate SHA-256 checksums
        run: |
          cd dist
          shasum -a 256 *.dmg *.zip > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Orbit-macOS-latest
          path: |
            dist/*.dmg
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
